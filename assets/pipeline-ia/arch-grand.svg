<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" role="img" aria-labelledby="archTitle">
  <title id="archTitle">Architecture grand schéma — benchmark parallèle et orchestration Pascal Robotics</title>
  <defs>
    <linearGradient id="ag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#55cbff"/><stop offset="50%" stop-color="#9ce51a"/><stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="agPanel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1620"/><stop offset="100%" stop-color="#080c12"/>
    </linearGradient>
    <filter id="aglow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1100" height="640" fill="#070b12"/>
  <ellipse cx="550" cy="300" rx="380" ry="200" fill="rgba(85,203,255,.04)"/>

  <!-- LEFT: current Francis workflow -->
  <rect x="28" y="48" width="250" height="420" rx="18" fill="url(#agPanel)" stroke="rgba(255,255,255,.1)"/>
  <text x="153" y="78" text-anchor="middle" fill="#8ae0ff" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="800" letter-spacing="0.1em">WORKFLOW FRANCIS</text>
  <text x="153" y="96" text-anchor="middle" fill="#6f7b82" font-family="Inter,system-ui,sans-serif" font-size="10">chaîne actuelle</text>

  <g font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="650" text-anchor="middle">
    <rect x="52" y="118" width="202" height="36" rx="8" fill="#0c121a" stroke="rgba(85,203,255,.3)"/>
    <text x="153" y="140" fill="#e8eef2">Agents · recettes · prompts</text>
    <text x="153" y="168" fill="rgba(85,203,255,.45)" font-size="14">↓</text>
    <rect x="52" y="178" width="202" height="36" rx="8" fill="#0c121a" stroke="rgba(255,255,255,.12)"/>
    <text x="153" y="200" fill="#bac4c8">Higgsfield</text>
    <text x="153" y="228" fill="rgba(85,203,255,.45)" font-size="14">↓</text>
    <rect x="52" y="238" width="202" height="36" rx="8" fill="#0c121a" stroke="rgba(255,255,255,.12)"/>
    <text x="153" y="260" fill="#bac4c8">Seedance 2.5</text>
    <text x="153" y="288" fill="rgba(85,203,255,.45)" font-size="14">↓</text>
    <rect x="52" y="298" width="202" height="44" rx="8" fill="#0c121a" stroke="rgba(245,197,66,.35)"/>
    <text x="153" y="316" fill="#f5c542" font-weight="800">Crédits ≈ 6 000</text>
    <text x="153" y="332" fill="#9aa8b4" font-size="10">/ projet</text>
    <text x="153" y="360" fill="rgba(85,203,255,.45)" font-size="14">↓</text>
    <rect x="52" y="370" width="202" height="36" rx="8" fill="#0c121a" stroke="rgba(255,255,255,.12)"/>
    <text x="153" y="392" fill="#bac4c8">DaVinci Resolve</text>
  </g>

  <!-- CENTER label: benchmark en parallèle -->
  <rect x="300" y="48" width="500" height="36" rx="10" fill="rgba(85,203,255,.06)" stroke="rgba(85,203,255,.25)"/>
  <text x="550" y="71" text-anchor="middle" fill="#8ae0ff" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="800" letter-spacing="0.08em">BENCHMARK EN PARALLÈLE</text>

  <!-- CENTER: Pascal Robotics orchestration -->
  <g filter="url(#aglow)">
    <rect x="300" y="100" width="500" height="220" rx="20" fill="#0a1210" stroke="url(#ag)" stroke-width="1.8"/>
  </g>
  <text x="550" y="132" text-anchor="middle" fill="#c6ff5b" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="900" letter-spacing="0.08em">PASCAL ROBOTICS · ORCHESTRATION</text>
  <text x="550" y="152" text-anchor="middle" fill="#9aa8b4" font-family="Inter,system-ui,sans-serif" font-size="11">routing · workflow · queue · versions · retry · storage</text>
  <text x="550" y="170" text-anchor="middle" fill="#9aa8b4" font-family="Inter,system-ui,sans-serif" font-size="11">monitoring · cost · quality · API · validation humaine</text>

  <!-- connected models -->
  <g font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle">
    <rect x="330" y="196" width="100" height="34" rx="8" fill="#0c121a" stroke="rgba(167,139,250,.4)"/>
    <text x="380" y="217" fill="#c4b5fd">WAN</text>
    <rect x="450" y="196" width="100" height="34" rx="8" fill="#0c121a" stroke="rgba(167,139,250,.4)"/>
    <text x="500" y="217" fill="#c4b5fd">LTX</text>
    <rect x="570" y="196" width="100" height="34" rx="8" fill="#0c121a" stroke="rgba(167,139,250,.35)"/>
    <text x="620" y="217" fill="#c4b5fd">autres</text>
    <rect x="690" y="196" width="90" height="34" rx="8" fill="#0c121a" stroke="rgba(85,203,255,.3)"/>
    <text x="735" y="217" fill="#8ae0ff">hybride</text>
  </g>
  <text x="550" y="258" text-anchor="middle" fill="#6f7b82" font-family="Inter,system-ui,sans-serif" font-size="10">modèles open-weight · routage optionnel vers Seedance</text>
  <text x="550" y="290" text-anchor="middle" fill="#c6ff5b" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="750">LE MODÈLE PEUT CHANGER · LE SERVEUR PEUT CHANGER · L’ORCHESTRATION RESTE</text>

  <!-- PHASE POC block -->
  <rect x="300" y="340" width="240" height="128" rx="16" fill="#0c121a" stroke="rgba(85,203,255,.35)"/>
  <text x="420" y="368" text-anchor="middle" fill="#55cbff" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="800" letter-spacing="0.08em">PHASE POC</text>
  <text x="420" y="392" text-anchor="middle" fill="#e8eef2" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="700">GPU LOUÉ À L’HEURE</text>
  <text x="420" y="414" text-anchor="middle" fill="#9aa8b4" font-family="Inter,system-ui,sans-serif" font-size="11">→ MESURE</text>
  <text x="420" y="436" text-anchor="middle" fill="#6f7b82" font-family="Inter,system-ui,sans-serif" font-size="10">qualité · temps · coût · échecs</text>
  <text x="420" y="452" text-anchor="middle" fill="#6f7b82" font-family="Inter,system-ui,sans-serif" font-size="10">retries · rendu utilisable</text>

  <!-- SI VALIDATION -->
  <rect x="560" y="340" width="240" height="128" rx="16" fill="#0c121a" stroke="rgba(156,229,26,.35)"/>
  <text x="680" y="368" text-anchor="middle" fill="#9ce51a" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="800" letter-spacing="0.08em">SI VALIDATION</text>
  <text x="680" y="392" text-anchor="middle" fill="#e8eef2" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="700">INFRASTRUCTURE MCT</text>
  <text x="680" y="414" text-anchor="middle" fill="#9aa8b4" font-family="Inter,system-ui,sans-serif" font-size="11">→ PIPELINE MAÎTRISÉ</text>
  <text x="680" y="436" text-anchor="middle" fill="#6f7b82" font-family="Inter,system-ui,sans-serif" font-size="10">même orchestration</text>
  <text x="680" y="452" text-anchor="middle" fill="#6f7b82" font-family="Inter,system-ui,sans-serif" font-size="10">exécution qui change</text>

  <!-- arrow between poc and validation -->
  <text x="550" y="410" text-anchor="middle" fill="rgba(156,229,26,.55)" font-family="Inter,system-ui,sans-serif" font-size="18">→</text>

  <!-- bottom mantra bar -->
  <rect x="28" y="500" width="1044" height="100" rx="16" fill="rgba(156,229,26,.04)" stroke="rgba(156,229,26,.22)"/>
  <text x="550" y="540" text-anchor="middle" fill="#c6ff5b" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="800">Francis crée · Pascal Robotics orchestre · MCT fournit la puissance de calcul</text>
  <text x="550" y="566" text-anchor="middle" fill="#9aa8b4" font-family="Inter,system-ui,sans-serif" font-size="12">Le modèle peut changer. L’infrastructure peut changer. Le workflow créatif reste.</text>
  <text x="550" y="586" text-anchor="middle" fill="#9aa8b4" font-family="Inter,system-ui,sans-serif" font-size="12">L’orchestration Pascal Robotics fait le lien.</text>
</svg>
