<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Flux créatif vers infrastructure GPU">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#55cbff" stop-opacity=".9"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#55cbff" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#55cbff" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="320" fill="#070b12"/>
  <ellipse cx="900" cy="80" rx="220" ry="90" fill="url(#g2)"/>
  <ellipse cx="280" cy="240" rx="180" ry="70" fill="url(#g2)"/>
  <!-- flow lines -->
  <path d="M80 180 C220 80, 380 260, 520 140 S780 60, 920 160 S1080 240, 1140 120" fill="none" stroke="url(#g1)" stroke-width="2.5" opacity=".7" filter="url(#glow)"/>
  <path d="M60 220 C200 140, 340 280, 500 200 S760 120, 900 200 S1060 260, 1160 180" fill="none" stroke="#a78bfa" stroke-width="1.2" opacity=".35"/>
  <!-- nodes -->
  <g filter="url(#glow)">
    <circle cx="160" cy="165" r="10" fill="#55cbff"/>
    <circle cx="400" cy="195" r="8" fill="#8ae0ff"/>
    <circle cx="620" cy="115" r="11" fill="#a78bfa"/>
    <circle cx="860" cy="175" r="9" fill="#55cbff"/>
    <circle cx="1080" cy="145" r="12" fill="#c4b5fd"/>
  </g>
  <!-- labels -->
  <text x="160" y="250" text-anchor="middle" fill="#9aa8b4" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600">Brief</text>
  <text x="400" y="270" text-anchor="middle" fill="#9aa8b4" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600">Génération IA</text>
  <text x="620" y="70" text-anchor="middle" fill="#9aa8b4" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600">Orchestration</text>
  <text x="860" y="250" text-anchor="middle" fill="#9aa8b4" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600">GPU maîtrisé</text>
  <text x="1080" y="80" text-anchor="middle" fill="#9aa8b4" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600">Sortie</text>
</svg>
