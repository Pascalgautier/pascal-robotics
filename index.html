<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pascal Robotics</title>
  <meta name="description" content="Pascal Robotics — Digital Twin, Physical AI, robotique mobile et humanoïde.">
  <meta name="theme-color" content="#05070a">
  <link rel="canonical" href="https://pascal-robotics.fr/">
  <style>
    html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden}
    .splash{
      position:fixed;inset:0;
      width:100%;height:100%;
      background:#000;
    }
    .splash video{
      width:100%;height:100%;
      object-fit:cover;
      display:block;
      background:#000;
    }
    /* Portrait / phone: show full frame, no crop */
    @media (max-width:900px), (orientation: portrait){
      .splash video{
        object-fit:contain;
        object-position:center center;
      }
    }
    .skip{
      position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;
    }
    .skip:focus{
      left:12px;top:12px;width:auto;height:auto;padding:10px 14px;
      background:#9ce51a;color:#0a0e10;border-radius:999px;
      font:650 13px/1.2 system-ui,sans-serif;z-index:3;text-decoration:none;
    }
  </style>
</head>
<body>
  <a class="skip" href="accueil.html">Passer la vidéo</a>
  <div class="splash" id="splash">
    <video
      id="intro"
      autoplay
      muted
      playsinline
      preload="auto"
      poster="/assets/digital-twin-pipeline-poster.jpg"
    >
      <source src="/assets/digital-twin-pipeline.mp4" type="video/mp4">
    </video>
  </div>
  <script>
  (function () {
    var NEXT = 'accueil.html';
    var v = document.getElementById('intro');
    if (!v) { location.replace(NEXT); return; }
    v.muted = true;
    function go() {
      if (go.done) return;
      go.done = true;
      location.replace(NEXT);
    }
    v.addEventListener('ended', go);
    v.addEventListener('error', go);
    // Safety: if autoplay is blocked or video stalls, don't strand the visitor
    var safety = setTimeout(go, 22000);
    v.addEventListener('ended', function () { clearTimeout(safety); }, { once: true });
    v.play().catch(function () { /* muted autoplay should work; safety timeout remains */ });
  })();
  </script>
</body>
</html>
