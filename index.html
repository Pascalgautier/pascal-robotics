<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pascal Robotics</title>
  <meta name="description" content="Pascal Robotics — Digital Twin, Physical AI, robotique mobile et humanoïde.">
  <meta name="theme-color" content="#050b18">
  <link rel="modulepreload" href="/assets/intro-orb/intro-orb.js?v=20260930b">
  <link rel="modulepreload" href="/assets/vendor/three-0.186.1/three.module.min.js">
  <link rel="canonical" href="https://pascal-robotics.fr/">
  <style>
    html,body{margin:0;padding:0;height:100%;background:#050b18;overflow:hidden}
    .splash{position:fixed;inset:0;width:100%;height:100%;background:#050b18}
    /* Séquence d'ouverture « gros Orbe » : canvas WebGL sur fond navy #050b18 ; à la fin de la plongée il s'estompe vers le navy,
       puis redirection vers /orchestrai (qui se dévoile en fondu depuis un voile navy identique). */
    .orb-layer{position:absolute;inset:0;z-index:2;background:#050b18;pointer-events:none}
    .orb-layer[hidden]{display:none}
    .orb-layer canvas{position:absolute;inset:0;width:100%;height:100%;display:block;will-change:opacity}
    .orb-flash{
      position:absolute;inset:0;opacity:0;pointer-events:none;
      background:radial-gradient(ellipse at 50% 50%,rgba(127,178,255,.55) 0%,rgba(61,139,255,.18) 38%,rgba(5,11,24,0) 72%);
    }
    /* « Passer l'intro » : discret mais visible dès le début */
    .skip{
      position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));z-index:4;
      padding:9px 16px;border-radius:999px;
      font:600 12.5px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.03em;
      color:rgba(214,230,255,.86);text-decoration:none;
      background:rgba(5,11,24,.55);border:1px solid rgba(127,178,255,.34);
      -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
      transition:background .18s ease,border-color .18s ease,color .18s ease;
    }
    .skip:hover{background:rgba(61,139,255,.28);border-color:rgba(127,178,255,.7);color:#fff}
    .skip:focus-visible{outline:2px solid #7fb2ff;outline-offset:3px;color:#fff}
    @media (prefers-reduced-motion:reduce){.skip{transition:none}}
  </style>
</head>
<body>
  <a class="skip" id="skip" href="/orchestrai">Passer l'intro</a>
  <div class="splash" id="splash">
    <div class="orb-layer" id="orbLayer" aria-hidden="true">
      <canvas id="orbCanvas"></canvas>
      <div class="orb-flash" id="orbFlash"></div>
    </div>
  </div>
  <script>
  /* ===== Intro : GROS ORBE 3D (plongée dans la sphère) -> fondu navy -> /orchestrai (fondu d'entrée) =====
     - Mécanisme : juste avant la redirection, sessionStorage['pr-intro-orb']='1' ; orchestrai.html (script inline dans le <head>)
       pose alors un voile navy #050b18 avant le premier rendu et le lève en ~1 s. Ici, l'orbe s'estompe vers le même navy : aucune coupure.
     - La vidéo n'est plus jouée dans ce parcours (fichiers conservés dans le dépôt).
     - prefers-reduced-motion, WebGL absent, module/three indisponible ou trop lent (> 4 s), contexte WebGL perdu
       => redirection directe vers /orchestrai (même voile).
     - Filets de sécurité : dans tous les cas, arrivée à /orchestrai. */
  (function () {
    var NEXT = '/orchestrai';
    var layer = document.getElementById('orbLayer');
    var canvas = document.getElementById('orbCanvas');
    var flash = document.getElementById('orbFlash');
    var skip = document.getElementById('skip');

    try {
      var lg = localStorage.getItem('pr-lang') || localStorage.getItem('pr_lang');
      if (lg === 'en') { skip.textContent = 'Skip intro'; document.documentElement.lang = 'en'; }
    } catch (e) {}

    function flag() { try { sessionStorage.setItem('pr-intro-orb', '1'); } catch (e) {} }
    function go() {
      if (go.done) return;
      go.done = true;
      flag();
      location.replace(NEXT);
    }
    skip.addEventListener('click', flag);      // le lien navigue ensuite normalement vers /orchestrai (fondu d'entrée conservé)

    var reduce = false;
    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    var orbMode = !reduce;
    var started = false, loadGuard = 0, safety = 0, orb = null;

    function dropOrb() {
      if (orb) { try { orb.destroy(); } catch (e) {} orb = null; }
      layer.hidden = true;
    }
    function fallbackToNext() { dropOrb(); go(); }

    function prefetchNext() {
      try {
        var l = document.createElement('link'); l.rel = 'prefetch'; l.href = NEXT; l.as = 'document';
        document.head.appendChild(l);
      } catch (e) {}
    }

    window.PRIntro = {
      orbMode: orbMode,
      // appelé par le module 3D quand three est chargé et que le renderer WebGL est prêt
      ready: function (create) {
        if (started || go.done) return;
        // pré-test WebGL (sans passer par three : pas d'erreur console si absent)
        var okGL = false;
        try { var tc = document.createElement('canvas'); okGL = !!(tc.getContext('webgl2') || tc.getContext('webgl')); } catch (e) {}
        if (!okGL) { fallbackToNext(); return; }
        var small = Math.min(window.innerWidth, window.innerHeight) < 600 || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        create(canvas, {
          small: small,
          onFlash: function (k) { flash.style.opacity = k.toFixed(3); },
          onHandoff: function () { flag(); prefetchNext(); },
          onFade: function (k) {
            var e = k * k * (3 - 2 * k);
            canvas.style.opacity = (1 - e).toFixed(3);
            flash.style.opacity = Math.min(parseFloat(flash.style.opacity) || 0, 1 - e).toFixed(3);
          },
          onEnd: function () { go(); },
          onFail: fallbackToNext
        }).then(function (o) {
          if (started || go.done) { o.destroy(); return; }
          started = true;
          orb = o; clearTimeout(loadGuard); o.start();
          // filet : si la plongée ne se termine pas (onglet figé...), on part quand même
          safety = setTimeout(go, 9000);
        }).catch(fallbackToNext);
      },
      fail: fallbackToNext
    };

    if (orbMode) {
      // three + module trop lents / navigateur sans modules : direct vers /orchestrai après 4 s
      loadGuard = setTimeout(fallbackToNext, 4000);
      // filet global : jamais bloqué plus de 12 s
      setTimeout(go, 12000);
    } else {
      layer.hidden = true;
      go();
    }
  })();
  </script>
  <script type="module">
    import { createIntroOrb } from '/assets/intro-orb/intro-orb.js?v=20260930b';
    if (window.PRIntro && window.PRIntro.orbMode) window.PRIntro.ready(createIntroOrb);
  </script>
</body>
</html>
