<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-label="Pascal Robotics au centre du système">
  <defs>
    <linearGradient id="og" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55cbff"/><stop offset="100%" stop-color="#9ce51a"/>
    </linearGradient>
    <filter id="oglow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="320" fill="#070b12"/>
  <!-- spokes -->
  <g stroke="rgba(85,203,255,.25)" stroke-width="1.2" fill="none">
    <line x1="450" y1="160" x2="140" y2="70"/>
    <line x1="450" y1="160" x2="140" y2="250"/>
    <line x1="450" y1="160" x2="760" y2="70"/>
    <line x1="450" y1="160" x2="760" y2="250"/>
    <line x1="450" y1="160" x2="450" y2="40"/>
    <line x1="450" y1="160" x2="450" y2="280"/>
  </g>
  <!-- peripheral nodes -->
  <g font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="650" text-anchor="middle">
    <rect x="40" y="42" width="160" height="44" rx="10" fill="#0c121a" stroke="rgba(85,203,255,.35)"/>
    <text x="120" y="68" fill="#8ae0ff">Francis · création</text>
    <rect x="40" y="222" width="160" height="44" rx="10" fill="#0c121a" stroke="rgba(85,203,255,.25)"/>
    <text x="120" y="248" fill="#bac4c8">Workflow / DaVinci</text>
    <rect x="700" y="42" width="160" height="44" rx="10" fill="#0c121a" stroke="rgba(167,139,250,.4)"/>
    <text x="780" y="68" fill="#c4b5fd">WAN · LTX · autres</text>
    <rect x="700" y="222" width="160" height="44" rx="10" fill="#0c121a" stroke="rgba(167,139,250,.3)"/>
    <text x="780" y="248" fill="#bac4c8">Seedance (hybride)</text>
    <rect x="370" y="18" width="160" height="36" rx="10" fill="#0c121a" stroke="rgba(255,255,255,.15)"/>
    <text x="450" y="40" fill="#9aa8b4">Mesure · logs · coût</text>
    <rect x="370" y="266" width="160" height="36" rx="10" fill="#0c121a" stroke="rgba(255,255,255,.15)"/>
    <text x="450" y="288" fill="#9aa8b4">GPU loué → MCT</text>
  </g>
  <!-- center -->
  <g filter="url(#oglow)">
    <rect x="310" y="118" width="280" height="84" rx="16" fill="#0a1210" stroke="url(#og)" stroke-width="1.8"/>
  </g>
  <text x="450" y="150" text-anchor="middle" fill="#c6ff5b" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="800" letter-spacing="0.06em">PASCAL ROBOTICS</text>
  <text x="450" y="172" text-anchor="middle" fill="#9aa8b4" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600">orchestration · intégration · POC</text>
</svg>
