<title>VALÉRIEN 3D — V7.4e</title>
<!--
  ============================================================================
  FRED ÉCHIQUIER — VALÉRIEN 3D — V7
  ----------------------------------------------------------------------------
  Historique : V6 (1 pion, tige en rainure) → V6.2 (boule, pièce pendue) →
  V6.3 (prise à deux pièces) → V7 (32 pièces, partie courte, gestes fluides).

  Mécanique validée par Pascal (21/11/2026) :
   - une rainure laisse passer deux tiges côte à côte ;
   - la pièce prise sort par le côté crénelé le plus proche ;
   - on peut SOULEVER une pièce jusqu'à ce que la boule bute sous les cases ;
   - une fois soulevée, la tige s'incline dans la rainure : le corps se
     déplace en courbe et CONTOURNE les autres pièces (monter, aller, poser).

  Modèle du geste (un coup) :
   1. levée verticale (la boule remonte vers le dessous des cases) ;
   2. l'axe de la tige parcourt les rainures (trajet en lignes de rainures) ;
      le corps suit une courbe lissée, écartée des pièces voisines, dans la
      limite d'inclinaison de la tige (pivot : point où la tige traverse
      le plateau) ;
   3. pose verticale et recentrage sur la case.
  Chaque image est contrôlée : collision 3D pièce / plateau, tige en rainure,
  boule retenue, écart corps / corps avec toutes les autres pièces.

  Dépendances (CDN) : three@0.160.0, OrbitControls, RoomEnvironment.
  Unité : le « pas » = case + rainure (≈ 50 mm, à confirmer). [H] = hypothèse.
  ============================================================================
-->

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ==========================================================================
   1. CONFIG — géométrie (unité = pas). [H] = hypothèse non validée.
   Repère : x = colonnes (a → h), z = rangées (rangée 1 en +z, Blancs),
            y = vertical (fond du bac à y = 0).
   ========================================================================== */
const C = {
  PAS_MM: 50,            // [H]
  plateW: 0.80,          // [H] rainure 0,20 pas ≈ 10 mm (deux tiges côte à côte : validé)
  plateT: 0.04,
  plateTopY: 1.30,
  pillarW: 0.36,
  rodR: 0.032,
  bendR: 0.07,
  footT: 0.06,
  ballR: 0.15,           // [H] boule > rainure·√2/2 : retenue aux croisements
  ballY: 0.25,           // [H] boule au repos → tige ≈ 1 pas
  wallInner: 4.16, wallT: 0.03, wallTopY: 1.24,
  notchW: 0.10, notchD: 0.25, notchPitch: 0.5,
  flangeW: 0.10,
  LIFT: 0.80,            // levée de la pièce. Butée de la boule ≈ 0,90 pas (≈ 45 mm) ; marge ≈ 5 mm
  TILT_MAX: 0.34,        // [H] écart horizontal maxi du corps permis par l'inclinaison de la tige (≈ 17 mm)
  CLEAR: 0.035,          // jeu visé entre deux pièces pendant les gestes (≈ 1,8 mm)
};
C.yPB = C.plateTopY - C.plateT;
C.notchBottom = C.wallTopY - C.notchD;
C.wallOuter = C.wallInner + C.wallT;
C.yRod = C.rodR + 0.003;
C.ballLocalY = C.ballY - C.plateTopY;

/* ==========================================================================
   2. SCÈNE
   ========================================================================== */
if (new URLSearchParams(location.search).has('embed')) document.body.classList.add('embed');
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, preserveDrawingBuffer:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a3038);
const pmrem = new THREE.PMREMGenerator(renderer);
const ROOM_ENV = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = ROOM_ENV;
const camera = new THREE.PerspectiveCamera(36, 1, 0.05, 400);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.minDistance = 1.5; controls.maxDistance = 40;
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x3a3f2a, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(-9, 22, 12); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-14, right:14, top:14, bottom:-14, near:1, far:70 });
sun.shadow.bias = -0.0004; scene.add(sun);

const M = {
  steel:  new THREE.MeshStandardMaterial({ color:0xb9bdc2, metalness:0.85, roughness:0.38 }),
  alu:    new THREE.MeshStandardMaterial({ color:0xd9dcdf, metalness:0.55, roughness:0.45 }),
  pillarDark: new THREE.MeshStandardMaterial({ color:0x2a2c30, metalness:0.3, roughness:0.6 }),
  white:  new THREE.MeshStandardMaterial({ color:0xf4f4f2, roughness:0.35 }),
  black:  new THREE.MeshStandardMaterial({ color:0x16171a, roughness:0.4 }),
  pieceW: new THREE.MeshStandardMaterial({ color:0xeae2c8, roughness:0.55 }),
  pieceB: new THREE.MeshStandardMaterial({ color:0x1f1d1c, roughness:0.42 }),
};
const xrayable = [M.steel, M.alu, M.pillarDark, M.white, M.black];

/* ==========================================================================
   3. PLATEAU + BOÎTES DE COLLISION
   ========================================================================== */
const board = new THREE.Group(); scene.add(board);
const boxes = [], pedestal = [];
const sqCenter = (f, r) => new THREE.Vector2(f - 3.5, 3.5 - r);
const sqName = (f, r) => 'abcdefgh'[f] + (r + 1);
const parseSq = s => ({ f:'abcdefgh'.indexOf(s[0]), r:+s[1] - 1 });
function solid(w, h, d, x, y, z, mat, tag) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; board.add(m);
  if (tag) boxes.push({ min:[x - w / 2, y - h / 2, z - d / 2], max:[x + w / 2, y + h / 2, z + d / 2], tag });
  return m;
}
(function buildBoard() {
  for (let f = 0; f < 8; f++) for (let r = 0; r < 8; r++) {
    const c = sqCenter(f, r), dark = (f + r) % 2 === 0;
    solid(C.plateW, C.plateT, C.plateW, c.x, C.plateTopY - C.plateT / 2, c.y, dark ? M.black : M.white, 'case ' + sqName(f, r));
    solid(C.pillarW, C.yPB, C.pillarW, c.x, C.yPB / 2, c.y, dark ? M.pillarDark : M.alu, 'pilier ' + sqName(f, r));
  }
  const W = C.wallOuter;
  solid(2 * W, 0.04, 2 * W, 0, -0.02, 0, M.steel, 'fond du bac');
  const notches = []; for (let z = -4; z <= 4 + 1e-9; z += C.notchPitch) notches.push(z);
  for (const s of [-1, 1]) {
    const x = s * (C.wallInner + C.wallT / 2);
    solid(C.wallT, C.notchBottom, 2 * W, x, C.notchBottom / 2, 0, M.steel, 'paroi crénelée');
    const edges = [-W]; for (const z of notches) edges.push(z - C.notchW / 2, z + C.notchW / 2); edges.push(W);
    for (let i = 0; i < edges.length; i += 2) { const z0 = edges[i], z1 = edges[i + 1]; if (z1 - z0 < 1e-6) continue;
      solid(C.wallT, C.notchD, z1 - z0, x, C.notchBottom + C.notchD / 2, (z0 + z1) / 2, M.steel, 'créneau de paroi'); }
  }
  for (const s of [-1, 1]) {
    solid(2 * W, C.wallTopY, C.wallT, 0, C.wallTopY / 2, s * (C.wallInner + C.wallT / 2), M.steel, "paroi d'extrémité");
    solid(2 * C.wallInner, 0.02, C.flangeW, 0, C.wallTopY - 0.01, s * (C.wallInner - C.flangeW / 2), M.steel, 'retour de paroi');
  }
  pedestal.push(solid(1.2, 14.5, 1.2, 0, -7.3, 0, M.steel, 'pied de table'));   // [H] plateau à ≈ 80 cm du sol
  const base = new THREE.Mesh(new THREE.BoxGeometry(10, 0.2, 10), M.steel);   // platine carrée inox (photo du parc)
  base.position.y = -14.55; base.castShadow = true; base.receiveShadow = true; board.add(base); pedestal.push(base);
  const mk = (txt, x, z) => {
    const cv = document.createElement('canvas'); cv.width = cv.height = 64;
    const g = cv.getContext('2d'); g.fillStyle = '#cfd6de'; g.font = 'bold 40px sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(txt, 32, 34);
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:new THREE.CanvasTexture(cv), depthTest:false, transparent:true }));
    sp.scale.set(0.32, 0.32, 1); sp.position.set(x, C.plateTopY + 0.05, z); board.add(sp);
  };
})();

/* ==========================================================================
   4. PIÈCES — corps Staunton simplifiés (hauteurs proches de la photo :
   roi ≈ 1,25 pas, pion ≈ 0,7 pas), pied plat, tige courbée, boule.
   ========================================================================== */
const PROFILES = {   // (rayon, hauteur) en pas
  P: [[0,0],[0.24,0],[0.24,0.04],[0.21,0.08],[0.17,0.11],[0.12,0.17],[0.09,0.33],[0.08,0.42],[0.13,0.45],[0.13,0.48],[0.08,0.5],[0,0.5]],
  R: [[0,0],[0.27,0],[0.27,0.05],[0.23,0.09],[0.19,0.13],[0.15,0.2],[0.14,0.55],[0.18,0.6],[0.19,0.8],[0.15,0.8],[0.15,0.74],[0,0.74]],
  B: [[0,0],[0.26,0],[0.26,0.05],[0.22,0.09],[0.17,0.13],[0.12,0.22],[0.09,0.5],[0.15,0.54],[0.15,0.57],[0.09,0.6],[0,0.6]],
  Q: [[0,0],[0.28,0],[0.28,0.05],[0.24,0.09],[0.19,0.13],[0.13,0.24],[0.09,0.66],[0.17,0.7],[0.17,0.73],[0.1,0.76],[0.12,0.86],[0.17,0.97],[0.13,0.99],[0,0.99]],
  K: [[0,0],[0.28,0],[0.28,0.05],[0.24,0.09],[0.19,0.13],[0.13,0.25],[0.1,0.72],[0.18,0.76],[0.18,0.79],[0.1,0.82],[0.12,0.92],[0.16,1.02],[0.12,1.05],[0,1.05]],
  N: [[0,0],[0.27,0],[0.27,0.05],[0.23,0.09],[0.19,0.13],[0.17,0.16],[0,0.16]],
};
const NAMES = { P:'pion', R:'tour', N:'cavalier', B:'fou', Q:'dame', K:'roi' };
const FR = { P:'', R:'T', N:'C', B:'F', Q:'D', K:'R' };

function bodyMeshes(type, mat, side) {
  const out = [];
  const lathe = new THREE.Mesh(new THREE.LatheGeometry(PROFILES[type].map(p => new THREE.Vector2(p[0], p[1])), 40), mat);
  out.push(lathe);
  const add = (geo, x, y, z, sy = 1) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.scale.y = sy; out.push(m); return m; };
  if (type === 'P') add(new THREE.SphereGeometry(0.11, 28, 18), 0, 0.6, 0);
  if (type === 'B') { add(new THREE.SphereGeometry(0.115, 28, 18), 0, 0.74, 0, 1.45); add(new THREE.SphereGeometry(0.04, 16, 10), 0, 0.94, 0); }
  if (type === 'Q') add(new THREE.SphereGeometry(0.06, 16, 10), 0, 1.05, 0);
  if (type === 'K') { add(new THREE.BoxGeometry(0.05, 0.2, 0.05), 0, 1.15, 0); add(new THREE.BoxGeometry(0.15, 0.05, 0.05), 0, 1.17, 0); }
  if (type === 'R') for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2 + Math.PI / 4;
    add(new THREE.BoxGeometry(0.07, 0.07, 0.09), 0.15 * Math.cos(a), 0.83, 0.15 * Math.sin(a)).rotation.y = -a; }
  if (type === 'N') {      // tête de cheval extrudée, tournée vers l'adversaire
    const s = new THREE.Shape(), pts = [[-0.16,0.14],[0.13,0.14],[0.11,0.3],[0.06,0.42],[0.19,0.54],[0.25,0.61],[0.22,0.69],[0.1,0.77],[0.02,0.86],[-0.04,0.8],[-0.12,0.74],[-0.18,0.6],[-0.2,0.4],[-0.18,0.22]];
    s.moveTo(pts[0][0], pts[0][1]); for (const p of pts.slice(1)) s.lineTo(p[0], p[1]); s.closePath();
    const g = new THREE.ExtrudeGeometry(s, { depth:0.16, bevelEnabled:true, bevelThickness:0.025, bevelSize:0.02, bevelSegments:3 });
    g.translate(0, 0, -0.08);
    const head = new THREE.Mesh(g, mat); head.rotation.y = side * Math.PI / 2; out.push(head);
  }
  return out;
}

/* Construit une pièce complète. Origine : centre de la base, au niveau du dessus des cases. */
function buildPiece(type, side, mat) {
  const off = new THREE.Vector2(0, 0.5 * side);            // [H] hypothèse A : tige au milieu du bord, côté du joueur
  const L = off.length(), dir = off.clone().normalize();
  const g = new THREE.Group();
  const body = bodyMeshes(type, mat, side);
  for (const m of body) { m.castShadow = true; m.receiveShadow = true; g.add(m); }
  const arm = new THREE.Group(); arm.rotation.y = Math.atan2(-dir.y, dir.x); g.add(arm);
  const r0 = PROFILES[type][1][0] * 0.55;
  const fs = new THREE.Shape();
  fs.moveTo(r0, -0.09); fs.lineTo(L - C.bendR, -0.04); fs.lineTo(L - C.bendR, 0.04); fs.lineTo(r0, 0.09); fs.closePath();
  const foot = new THREE.Mesh(new THREE.ExtrudeGeometry(fs, { depth:C.footT, bevelEnabled:false }), mat);
  foot.rotation.x = Math.PI / 2; foot.position.y = C.footT; foot.castShadow = true; arm.add(foot);
  const path = new THREE.CurvePath();
  path.add(new THREE.LineCurve3(new THREE.Vector3(L - C.bendR - 0.05, C.yRod, 0), new THREE.Vector3(L - C.bendR, C.yRod, 0)));
  const arc = []; for (let i = 0; i <= 12; i++) { const t = Math.PI / 2 * (1 - i / 12);
    arc.push(new THREE.Vector3(L - C.bendR + C.bendR * Math.cos(t), C.yRod - C.bendR + C.bendR * Math.sin(t), 0)); }
  path.add(new THREE.CatmullRomCurve3(arc));

/* ==========================================================================

/* ==========================================================================

    if (vic) {          // ⓪ l'attaquant vise : trajectoire courbe vers la pièce visée, puis elle s'efface
      TL.aims.push({ vic, t0:tStart, dur:AIM, from:pc.rest.pos.clone(), to:vic.rest.pos.clone(), hFrom:pc.g.userData.height, hTo:vic.g.userData.height,
                     label:`${label} — le ${pc.name} <b>vise</b> le ${vic.name} en ${sqName(b.f, b.r)}` });
      tStart += AIM + AFTER_AIM;
    }
    if (vic) {          // ① la pièce prise sort (légèrement transparente pendant le trajet)
      const s = vic.sq.f >= 4 ? 1 : -1;
      const others = snap(PCS.filter(p => !p.out && p !== vic));
      const zPref = vic.rest.P.y;
      const zN = pickSlot(s, zPref); slots[s].add(zN);
      const Ds = vic.rest.D, Dedge = sqCenter(s > 0 ? 7 : 0, vic.sq.r).add(vic.g.userData.off);
      // la tige peut rejoindre le bord par sa rangée ou par une rangée voisine si la sienne est encombrée
      const cands = [];
      for (const dz of [0, -1, 1, -2, 2]) {
        const zr = Ds.y + dz; if (Math.abs(zr) > 4) continue;
        const N0 = snapNode(Ds, V2(Ds.x - s, zr));
        const pts = dz ? [Ds, N0, V2(N0.x, zr), V2(4 * s, zr), V2(4 * s, zN)] : [Ds, Dedge, V2(4 * s, Ds.y), V2(4 * s, zN)];
        cands.push(clean(pts));
      }
      const path = cands.map(p => [scorePath(vic, p, others), p]).sort((x, y) => x[0] - y[0])[0][1];
      const carry = buildGesture(vic, path, others, 'carry');
      const hang = computeHang(vic, s, zN);
      const tip = buildTip(vic, carry[carry.length - 1], hang);
      const dCarry = (0.8 + 0.3 * Math.pow(pathLen(path), 0.8)) * 1.05 * TEMPO, dTip = 1.15 * TEMPO;
      const seg = { pc:vic, t0:tStart, dur:dCarry + dTip, samples:carry.concat(tip), split:carry.length / (carry.length + tip.length), dSplit:dCarry / (dCarry + dTip),
                    others, path, fade:{ tRestore:tStart + dCarry + dTip * 0.55 }, label:`${label} — <b>${vic.name} pris</b> : on le soulève, il glisse vers le bord et bascule dans un créneau` };
      TL.segs.push(seg); mv.segs.push(seg);
      vic.out = true; vic.hang = hang; vic.rest = { pos:hang.final.pos, quat:hang.final.quat, P:null, D:null };
      tStart += dCarry + dTip + AFTER_EXIT;   // l'attaquant attend que la pièce prise soit dehors
    }
    {                   // ② la pièce joue
      const others = snap(PCS.filter(p => !p.out && p !== pc));
      const De = sqCenter(b.f, b.r).add(pc.g.userData.off);
      const path = anchorCandidates(pc.rest.D, De).map(p => [scorePath(pc, p, others), p]).sort((x, y) => x[0] - y[0])[0][1];
      const samples = buildGesture(pc, path, others, 'move');
      const dur = (0.8 + 0.3 * Math.pow(pathLen(path), 0.8)) * TEMPO;
      const seg = { pc, t0:tStart, dur, samples, others, path,
                    label:`${label} — ${pc.name} ${a.f !== undefined ? sqName(a.f, a.r) : ''} → ${sqName(b.f, b.r)}${vic ? ' (prise)' : ''}` };
      TL.segs.push(seg); mv.segs.push(seg);
      pc.sq = { ...b }; pc.rest = restOf(pc, b);
      t = tStart + dur + PAUSE;
    }
    mv.t1 = t - PAUSE;
    TL.moves.push(mv);
  }
  TL.total = t + 0.8;
  verify();
}

/* Contrôle de chaque image de chaque geste */
function verify() {
  for (const mv of TL.moves) {
    mv.res = { board:Infinity, boardTag:'', body:Infinity, bodyWho:'', tilt:0, anchorBad:0, bad:0 };
    for (const seg of mv.segs) for (let i = 0; i < seg.samples.length; i++) {
      const x = seg.samples[i];
      const c3 = check3D(seg.pc, x.pos, x.quat);
      if (c3.margin < mv.res.board) { mv.res.board = c3.margin; mv.res.boardTag = `${c3.part} / ${c3.tag}`; }
      if (!c3.ok) mv.res.bad++;
      if (x.D) { const a = checkAnchor(x.D); if (!a.ok) { mv.res.anchorBad++; mv.res.bad++; } }
      if (x.D) { const bm = bodyMargin(seg.pc, x.pos, x.quat, seg.others);
        if (bm.margin < mv.res.body) { mv.res.body = bm.margin; mv.res.bodyWho = bm.who ? bm.who.name : ''; }
        if (bm.margin < -TOL) mv.res.bad++; }
      mv.res.tilt = Math.max(mv.res.tilt, x.tilt);
    }
  }
  renderMoves();
}

   10. LECTURE
   ========================================================================== */
function sampleSeg(seg, u) {
  const S = seg.samples; let k;
  if (seg.split) {   // deux sous-gestes de durées différentes (trajet puis bascule)

  } else k = u * (S.length - 1);
  k = Math.max(0, Math.min(S.length - 1, k));
  const i = Math.floor(k), j = Math.min(S.length - 1, i + 1), f = k - i;
  return { pos:S[i].pos.clone().lerp(S[j].pos, f), quat:S[i].quat.clone().slerp(S[j].quat, f) };
}
function poseAt(pc, t) {
  let last = null;
  for (const seg of TL.segs) if (seg.pc === pc && t >= seg.t0) last = seg;
  if (!last) { const c = sqCenter(pc.start.f, pc.start.r); return { pos:new THREE.Vector3(c.x, C.plateTopY, c.y), quat:new THREE.Quaternion() }; }
  return sampleSeg(last, Math.min(1, (t - last.t0) / last.dur));
}
const play = { t:0, playing:true, until:null, speed:1, slow:false };
/* Opacité de la pièce prise : 100 % → 80 % au départ, retour à 100 % une fois dehors */
function opacityAt(pc, t) {
  for (const seg of TL.segs) if (seg.pc === pc && seg.fade && t >= seg.t0 && t <= seg.t0 + seg.dur + 0.5)
    return 1 - (1 - FADE) * smooth((t - seg.t0) / 0.35) * (1 - smooth((t - seg.fade.tRestore) / 0.45));
  return 1;
}
/* Flash rouge (½ s) de la pièce visée, quand la flèche l'atteint */
const RED = new THREE.Color(0xe02020);
function flashAt(pc, t) {
  for (const a of TL.aims) if (a.vic === pc) { const u = (t - (a.t0 + 0.62)) / 0.5; if (u > 0 && u < 1) return Math.sin(Math.PI * u); }
  return 0;
}
function setFlash(pc, k) {
  const m = pc.pm; if (!m.userData.base) m.userData.base = m.color.clone();
  m.color.copy(m.userData.base).lerp(RED, k); m.emissive.setRGB(0.55 * k, 0.02 * k, 0.02 * k);
}
function setOpacity(pc, o) {
  const m = pc.pm, tr = o < 0.999;

  m.opacity = o;
}
/* Trajectoire de visée : arc orange qui se dessine de l'attaquant vers la cible, puis s'efface */
const aimMat = new THREE.MeshBasicMaterial({ color:0xff8a2a, transparent:true, opacity:0, depthTest:false });
const aimGroup = new THREE.Group(); aimGroup.renderOrder = 20; scene.add(aimGroup);
let aimCur = null, aimTube = null, aimHead = null, aimRing = null;
const AIM_SEG = 90, AIM_RAD = 8;
function setupAim(a) {
  aimGroup.clear(); if (aimTube) aimTube.geometry.dispose();
  const A = a.from.clone().add(new THREE.Vector3(0, a.hFrom + 0.15, 0)), B = a.to.clone().add(new THREE.Vector3(0, a.hTo + 0.2, 0));
  const M2 = A.clone().lerp(B, 0.5).add(new THREE.Vector3(0, 1.1 + 0.25 * A.distanceTo(B), 0));
  const curve = new THREE.QuadraticBezierCurve3(A, M2, B);

  aimHead = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.24, 16), aimMat);
  aimHead.position.copy(B); aimHead.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), curve.getTangent(1));
  aimRing = new THREE.Mesh(new THREE.TorusGeometry(0.36, 0.025, 8, 48), aimMat);
  aimRing.rotation.x = Math.PI / 2; aimRing.position.copy(a.to).add(new THREE.Vector3(0, 0.02, 0));

}
function drawAim(t) {
  const a = TL.aims.find(x => t >= x.t0 && t <= x.t0 + x.dur);
  if (!a) { aimMat.opacity = 0; aimGroup.visible = false; return null; }
  if (a !== aimCur) { aimCur = a; setupAim(a); }
  const u = (t - a.t0) / a.dur, grow = smooth(u / 0.4), fade = 1 - smooth((u - 0.75) / 0.25);
  aimGroup.visible = true; aimMat.opacity = 0.95 * fade;

}
function applyTime(t) {
  for (const pc of PCS) { const p = poseAt(pc, t); pc.g.position.copy(p.pos); pc.g.quaternion.copy(p.quat); setOpacity(pc, opacityAt(pc, t)); setFlash(pc, flashAt(pc, t)); }
  const aim = drawAim(t);
  let cur = null; for (const seg of TL.segs) if (t >= seg.t0 && t <= seg.t0 + seg.dur + 0.3) cur = seg;
  const mi = TL.moves.findIndex(m => t >= m.t0 - 0.05 && t <= m.t1 + 0.4);
  document.querySelectorAll('#moves div[data-i]').forEach(d => d.classList.toggle('cur', +d.dataset.i === mi));
  if (aim) caption(aim.label);
  else if (cur) caption(cur.label);
  else if (t >= TL.moves[TL.moves.length - 1].t1) caption('Fin de la séquence — <b>aucune pièce n\'a quitté le jeu</b> : les pièces prises pendent hors du bac, toujours reliées.');
  else if (t < TL.moves[0].t0) caption('Position de départ — les 32 pièces sont reliées au plateau par leur tige.');

let traceLine = null, showTrace = false, traceSeg = null;

let xray = false, autoRot = false;

/* Cadrage : le plateau entier, centré dans la zone libre de l'écran (à droite du
   panneau sur ordinateur), vu de face côté Blancs, bien à plat. */
const PANEL = () => (!document.body.classList.contains('embed') && innerWidth > 700 && $('ui').style.display !== 'none' && !$('ui').classList.contains('hidden')) ? 330 : 0;
function applyViewOffset() {
  const W = innerWidth, H = innerHeight, p = PANEL();
  // intégré au site (grand écran) : l'échiquier est décalé vers la droite, le texte du site occupe la gauche
  const shift = document.body.classList.contains('embed') && W > 900 ? W * 0.17 : 0;
  if (p || shift) camera.setViewOffset(W, H, -p / 2 - shift, 0, W, H); else camera.clearViewOffset();
}
function fitDistance(radius) {
  const W = innerWidth - PANEL(), H = innerHeight, vf = THREE.MathUtils.degToRad(camera.fov);
  const hf = 2 * Math.atan(Math.tan(vf / 2) * W / H);
  return radius / Math.sin(Math.min(vf, hf) / 2);
}

  return new THREE.Vector3(target.x + dist * Math.cos(el) * Math.sin(az), target.y + dist * Math.sin(el), target.z + dist * Math.cos(el) * Math.cos(az));
}
let camAnim = null;

const VIEWS = {
  persp:  () => { const port = camera.aspect < 1, T = new THREE.Vector3(0, port ? 0.4 : 0.6, port ? 0.2 : 0.35); return [orbitPos(T, fitDistance(port ? 4.75 : 6.3), port ? 56 : 44, 0), T]; },
  player: () => { const T = new THREE.Vector3(0, 0.9, 0.6); return [orbitPos(T, fitDistance(5.6), 28, 0), T]; },
  top:    () => { const T = new THREE.Vector3(0, 1.2, 0.25); return [orbitPos(T, fitDistance(5.9), 89.5, 0), T]; },
  amb:    () => { // joueur assis : œil à ≈ 1,25 m du sol, à ≈ 1,1 m de l'échiquier, regard incliné de 14° : l'échiquier en bas, le hall au-dessus
    const Pc = PANOS[gare.cur] || {}, port = camera.aspect < 1, eyeY = FLOOR_Y + (Pc.eye || 1.25) * 1000 / C.PAS_MM, horiz = (port ? 30 * Math.min(Pc.camK || 1, 1.2) : 22 * (Pc.camK || 1)), pitch = port ? 20 : 14;
    const T = new THREE.Vector3(0, eyeY - horiz * Math.tan(THREE.MathUtils.degToRad(pitch)), 0.4);
    return [orbitPos(T, horiz / Math.cos(THREE.MathUtils.degToRad(pitch)), pitch, (PANOS[gare.cur] && PANOS[gare.cur].camAz) || 18), T]; },

    fragmentShader:`varying vec3 vWorldPosition;

/* ==========================================================================
   11d. CHAISES DE BISTROT (d'après la photo du parc)
   Cadre en tube d'aluminium : pieds avant prolongés en accoudoirs, accoudoirs
   et dossier formant une seule boucle ; assise en 6 lattes de bois, dossier en
   3 lattes cintrées. Cotes [H] : assise à 45 cm, accoudoirs à 66 cm, dossier

const MC = {
  alu:  new THREE.MeshStandardMaterial({ color:0xd5d8dc, metalness:0.9, roughness:0.28 }),
  wood: new THREE.MeshStandardMaterial({ color:0xa8693a, roughness:0.62 }),

function tube(points, r = 0.24, closed = false) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)), closed, 'catmullrom', 0.3);
  const m = new THREE.Mesh(new THREE.TubeGeometry(curve, closed ? 80 : 48, r, 10, closed), MC.alu);
  m.castShadow = true; m.receiveShadow = true; return m;
}
function curvedSlat(radius, a0, a1, height, thick) {

  const sh = new THREE.Shape();
  sh.absarc(0, 0, radius + thick, a0, a1, false); sh.absarc(0, 0, radius, a1, a0, true);
  const g = new THREE.ExtrudeGeometry(sh, { depth:height, bevelEnabled:true, bevelThickness:0.05, bevelSize:0.05, bevelSegments:2, curveSegments:24 });
  g.rotateX(-Math.PI / 2);        // le secteur passe dans le plan horizontal, l'épaisseur devient la hauteur
  const m = new THREE.Mesh(g, MC.wood); m.castShadow = true; m.receiveShadow = true; return m;
}
function buildChair() {
  const c = new THREE.Group();          // origine : sol, centre de l'assise ; la chaise regarde vers +z
  const SY = 9, AY = 13.2;
  for (const sx of [-1, 1]) {
    // pied avant qui monte en accoudoir, puis rejoint la boucle du dossier
    c.add(tube([[sx * 4.5, 0, 4.6], [sx * 4.35, 4.5, 4.3], [sx * 4.2, 9.5, 3.9], [sx * 4.2, 12.4, 3.4], [sx * 4.5, AY, 2.0], [sx * 4.8, AY + 0.2, -0.5]]));
    // pied arrière

    // traverse latérale sous l'assise

  // traverses avant et arrière sous l'assise
  c.add(tube([[-4.2, SY - 0.5, 3.9], [0, SY - 0.6, 4.0], [4.2, SY - 0.5, 3.9]], 0.2));
  c.add(tube([[-4.3, SY - 0.5, -3.9], [0, SY - 0.6, -4.0], [4.3, SY - 0.5, -3.9]], 0.2));
  // assise : 6 lattes, légère descente vers l'avant
  for (let i = 0; i < 6; i++) {
    const z = -3.3 + i * 1.34;
    const m = new THREE.Mesh(new THREE.BoxGeometry(8.6, 0.3, 1.05), MC.wood);
    m.position.set(0, SY + 0.05 - (i === 5 ? 0.25 : 0) - Math.max(0, z) * 0.03, z); m.rotation.x = i === 5 ? 0.35 : 0;

  for (const [k, y] of [[0, 10.7], [1, 12.0], [2, 13.3]]) {
    const slat = curvedSlat(5.0 - k * 0.05, Math.PI * 0.62, Math.PI * 0.38 + Math.PI * 0.0, 1.05, 0.28);
    // a0 > a1 : on les inverse proprement
    c.add(slat); slat.position.set(0, y, 0);
  }
  return c;
}

function backSlat(y) {
  const g = new THREE.Group();
  const s = curvedSlat(4.9, -Math.PI / 2 - 0.95, -Math.PI / 2 + 0.95, 1.05, 0.28);

  clearDecor();
  const cfg = DECORS[k]();
  renderer.toneMappingExposure = cfg.exposure; sun.intensity = cfg.sun; if (hemi) hemi.intensity = cfg.hemi;
  sun.color.set(cfg.warm ? 0xfff1dc : 0xffffff);
  for (const [id, key] of [['dStudio', 'studio'], ['dGare', 'gare']]) $(id).classList.toggle('on', key === k);
  $('gareUI').style.display = k === 'gare' ? '' : 'none';
  if (typeof updateChairs === 'function') updateChairs();
  applyQuality();
}
$('dStudio').onclick = () => setDecor('studio');
$('dGare').onclick = () => { setDecor('gare'); setView('amb'); };   // en mode Gare : vue basse pour voir le hall
$('vAmb').onclick = () => setView('amb');

/* ==========================================================================
   12. BOUCLE
   ========================================================================== */
function resize() {
  // téléphone : panneau replié tant que l'utilisateur ne l'a pas ouvert
  if (!uiToggled) $('ui').classList.toggle('hidden', innerWidth <= 700);
  renderer.setSize(innerWidth, innerHeight, true); camera.aspect = innerWidth / innerHeight; applyViewOffset(); camera.updateProjectionMatrix();
  // la taille de la fenêtre change (chargement dans l'app, rotation) : on recadre, sauf si l'utilisateur a déplacé la vue
  if (!userMoved && typeof VIEWS !== 'undefined') setView(curView, true);
}
addEventListener('resize', resize); if (window.visualViewport) visualViewport.addEventListener('resize', resize);
resize(); setTimeout(resize, 300); setTimeout(resize, 1200);   // la vue intégrée de l'app peut prendre sa taille définitive après le chargement
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (camAnim) {
    const u = smooth((performance.now() - camAnim.start) / camAnim.dur);
    camera.position.lerpVectors(camAnim.p0, camAnim.p1, u); controls.target.lerpVectors(camAnim.t0, camAnim.t1, u);
    if (u >= 1) camAnim = null;
  }
  if (play.playing) {
    play.t += dt * play.speed * (play.slow ? 0.25 : 1);
    if (play.until !== null && play.t >= play.until) { play.t = play.until; play.until = null; play.playing = false; syncPlay(); }
    if (play.t >= TL.total) { if (typeof EMBED !== 'undefined' && EMBED) { if (!play.endAt) play.endAt = performance.now(); if (performance.now() - play.endAt > 3500) { play.t = 0; play.endAt = 0; } else play.t = TL.total; } else { play.t = TL.total; play.playing = false; syncPlay(); } }
  }
  applyTime(play.t);
  // Site : plan rapproché sur l'échiquier et lent tour automatique de caméra (≈ 1 tour en 90 s),
  // tant que le visiteur ne manipule pas la 3D
  if (typeof EMBED !== 'undefined' && EMBED && !controls.enabled && !camAnim) {
    cine.az += dt * 4; const port = camera.aspect < 1;
    const el = (port ? 40 : 30) + 3 * Math.sin(cine.az * Math.PI / 180 * 2);
    const T = new THREE.Vector3(0, 0.9, 0);
    camera.position.copy(orbitPos(T, fitDistance(port ? 4.4 : 4.5), el, cine.az)); controls.target.copy(T); camera.lookAt(T);
  }
  controls.update();
  updateGare();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
resize();
const EMBED = new URLSearchParams(location.search).has('embed');
const cine = { az:40 };
if (EMBED) {
  document.body.classList.add('embed'); controls.enabled = false;
  $('eInteract').onclick = () => { const on = !controls.enabled; controls.enabled = on; document.body.classList.toggle('interact', on);
    $('eInteract').textContent = on ? 'Terminer' : 'Manipuler en 3D'; };
}
buildTimeline();
setDecor('gare');          // ouverture directe dans le parc (Lieu 360°), vue « Ambiance »
setView('amb', true);
tick();
window.__valerien = { C, PCS, TL, play, applyTime, setView, setDecor, resize, gare, loadPanoFromBlob, check3D, bodyMargin, checkAnchor, buildTimeline };
</script>
